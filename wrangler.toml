name = "foundation-survey"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Fill in database_id after: npx wrangler d1 create foundation-survey
[[d1_databases]]
binding = "SURVEY_DB"
database_name = "foundation-survey"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Public base URL of the deployed survey, no trailing slash. Used for OAuth redirect URIs.
PUBLIC_BASE_URL = "https://YOUR_SURVEY_HOST"
# ISO timestamps. Submissions are refused outside this window.
SURVEY_OPENS_AT = "2026-12-01T14:00:00Z"
SURVEY_CLOSES_AT = "2026-12-15T23:59:00Z"
# Minimum account age in days for X, Discord and GitHub.
MIN_ACCOUNT_AGE_DAYS = "30"
# Rate limits per hashed IP per hour.
RATE_LIMIT_SIGNIN_PER_HOUR = "30"
RATE_LIMIT_SUBMIT_PER_HOUR = "10"
# Results: channels with fewer responses than this are not broken out.
MIN_CHANNEL_REPORT_SIZE = "5"
# Results: KPI figures are broken out by role only for roles with at least this many responses.
MIN_GROUP_REPORT_SIZE = "30"
# KPI target: percent positive. 80 comes from the 2027 budget workbook (line L37); confirm it for 2026.
KPI_TARGET_PCT = "80"
# Turnstile site key (public). The secret goes in TURNSTILE_SECRET.
TURNSTILE_SITE_KEY = "YOUR_TURNSTILE_SITE_KEY"
# Slack workspace IDs whose members may sign in with Slack (comma separated, e.g. T0123ABC).
SLACK_ALLOWED_TEAM_IDS = "YOUR_SLACK_TEAM_ID"
# Slack channel where the agents report what they did and where announcement drafts arrive (channel ID).
SLACK_WATCHDOG_CHANNEL_ID = "YOUR_SLACK_CHANNEL_ID"
# Slack user IDs who MAY override the agents (restore responses, lift a block early). Nobody has to.
SLACK_APPROVER_USER_IDS = "YOUR_SLACK_USER_IDS"
# Slack user ID of the announcement owner: approves, edits or skips each launch and reminder post.
SLACK_ANNOUNCEMENT_APPROVER_IDS = "YOUR_ANNOUNCEMENT_OWNER_SLACK_USER_ID"
# Community Slack channel that receives the announcements (channel ID). Empty = hand off to a person.
SLACK_ANNOUNCE_CHANNEL_ID = ""
# Limits on blocks the watchdog agent applies without a person. Enforced in code.
MAX_BLOCK_HOURS_NARROW = "24"   # one network or one launch-post link
MAX_BLOCK_HOURS_BROAD = "6"     # a whole channel or country (only one of these may be active at a time)
MAX_AUTO_BLOCKS_PER_DAY = "6"
# Account hashes and network details are deleted this many days after the survey closes.
IDENTITY_RETENTION_DAYS = "30"
# Cloudflare Access in front of /results. Without both values the results page stays closed.
ACCESS_TEAM_DOMAIN = "YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUD = "YOUR_ACCESS_APPLICATION_AUD"
# Optional: require Discord sign-ins to be members of this server (guild ID). Empty = no check.
DISCORD_REQUIRED_GUILD_ID = ""
# Discord server the fallback bot searches for handles (guild ID). Empty = Discord fallback off.
DISCORD_FALLBACK_GUILD_ID = ""
# Mattermost server base URL. Empty = Mattermost off.
MATTERMOST_URL = ""

# Secrets (set with: npx wrangler secret put NAME). Never commit these.
#   IDENTITY_PEPPER          random 32+ bytes; hashes account IDs and IPs
#   SESSION_SECRET           random 32+ bytes; signs cookies
#   WATCHDOG_API_KEY, AUDITOR_API_KEY, REPORTER_API_KEY, ANNOUNCER_API_KEY
#                            four different random 32+ byte keys, one per agent
#   TURNSTILE_SECRET
#   X_CLIENT_ID, X_CLIENT_SECRET
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN
#   SLACK_CLIENT_ID, SLACK_CLIENT_SECRET, SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
#   MATTERMOST_CLIENT_ID, MATTERMOST_CLIENT_SECRET, MATTERMOST_BOT_TOKEN
# Posting announcements (each optional; a channel without them is handed to a person):
#   DISCORD_ANNOUNCE_WEBHOOK_URL, MATTERMOST_ANNOUNCE_WEBHOOK_URL
#   X_POST_API_KEY, X_POST_API_SECRET, X_POST_ACCESS_TOKEN, X_POST_ACCESS_SECRET

# Every 15 minutes: publish approved announcements, self-check, clean up.
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------------------
# TEST VERSION: a separate Worker (foundation-survey-test) with its own database.
# Deploy with: npm run deploy:test       Nothing here affects the real survey.
# The three YOUR_TEST_ values are filled in by `node scripts/set-test.mjs` (see README).
# ---------------------------------------------------------------------------
[[env.test.d1_databases]]
binding = "SURVEY_DB"
database_name = "foundation-survey-test"
database_id = "YOUR_TEST_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.test.vars]
PUBLIC_BASE_URL = "https://YOUR_TEST_URL"
SURVEY_OPENS_AT = "2026-01-01T00:00:00Z"
SURVEY_CLOSES_AT = "2027-12-31T00:00:00Z"
MIN_ACCOUNT_AGE_DAYS = "30"
RATE_LIMIT_SIGNIN_PER_HOUR = "30"
RATE_LIMIT_SUBMIT_PER_HOUR = "10"
# Low minimums so the results page shows breakdowns with only a few test responses.
MIN_CHANNEL_REPORT_SIZE = "1"
MIN_GROUP_REPORT_SIZE = "1"
KPI_TARGET_PCT = "80"
MAX_BLOCK_HOURS_NARROW = "24"
MAX_BLOCK_HOURS_BROAD = "6"
MAX_AUTO_BLOCKS_PER_DAY = "6"
IDENTITY_RETENTION_DAYS = "30"
# Cloudflare's published Turnstile test key: the bot check always passes. Test use only.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
ACCESS_TEAM_DOMAIN = "YOUR_TEST_TEAM.cloudflareaccess.com"
ACCESS_AUD = "YOUR_TEST_ACCESS_AUD"
