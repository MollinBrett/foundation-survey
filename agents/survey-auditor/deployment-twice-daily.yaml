agent: ./agent.md
environment_id: ../survey-watchdog/environment.yaml
vault_ids: []          # fill in this agent's own vlt_... ID after its vault is created (README, step 3)
schedule:
  type: cron
  expression: "37 5,17 * * *"
  timezone: Etc/UTC
initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          Re-check the responses the watchdog has removed since your last run.
