agent: ./agent.md
environment_id: ./environment.yaml
vault_ids: []          # fill in this agent's own vlt_... ID after its vault is created (README, step 3)
schedule:
  type: cron
  expression: "7 * * * *"
  timezone: Etc/UTC
initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          Run your hourly review of new survey responses now.
